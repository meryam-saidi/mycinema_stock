sentry:
    dsn: "https://7fc82faa952b4d4aaf37ad61297d774e@o4505539269951488.ingest.sentry.io/4505584399613952"
    register_error_listener: false # Disables the ErrorListener to avoid duplicated log in sentry
    register_error_handler: false # Disables the ErrorListener, ExceptionListener and FatalErrorListener integrations of the base PHP SDK
    options:
        # Specify a fixed sample rate:
        traces_sample_rate: 1.0
        # Or provide a custom sampler:
        traces_sampler: 'sentry.callback.traces_sampler'
        
monolog:
    handlers:
        sentry:
            type: service
            id: Sentry\Monolog\Handler

services:
    Sentry\Monolog\Handler:
        arguments:
            $hub: '@Sentry\State\HubInterface'
            $level: !php/const Monolog\Logger::ERROR
    Monolog\Processor\PsrLogMessageProcessor:
        tags: { name: monolog.processor, handler: sentry }
    sentry.callback.traces_sampler:
        class: 'App\Service\Sentry'
        factory: [ '@App\Service\Sentry', 'getTracesSampler' ]        